name: Assets

on:
  push:
    branches:
      - main
      - "v*.*"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      elixir: "1.20.5"
      otp: "29.1.2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.elixir }}
          otp-version: ${{ env.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.otp }}-${{ env.elixir }}-dev-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.otp }}-${{ env.elixir }}-dev-
      - name: Install dependencies
        run: mix deps.get --only dev

      - name: Set up Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: mix assets.build

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v6.0.1
        with:
          app-id: ${{ secrets.GH_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.GH_AUTOFIX_PRIVATE_KEY }}
          owner: supabase
          repositories: phoenix

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'fix: rebuild assets from source changes'
          title: 'fix: rebuild assets'
          body: |
            Automated rebuild of assets from source changes.

            Built files in `priv/static/` have been regenerated from source in `assets/js/phoenix/`.

            **Files updated:**
            - `priv/static/phoenix.mjs` (+ sourcemap)
            - `priv/static/phoenix.cjs.js` (+ sourcemap)
            - `priv/static/phoenix.js`
            - `priv/static/phoenix.min.js`
            - `priv/static/types/`

            🤖 Auto-generated by Assets workflow.
          branch: 'gha/rebuild-assets-${{ github.run_number }}'
          base: 'main'

      - name: Enable automerge
        if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}